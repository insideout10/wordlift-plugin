name: Deploy to WordPress.org

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (X.Y.Z)
        required: true
        type: string
      dry_run:
        description: Verify without publishing
        required: true
        type: boolean
        default: true
      allow_large_diff:
        description: Allow more than 100 changed plugin files
        required: true
        type: boolean
        default: false

concurrency:
  group: wordpress-org-wordlift
  cancel-in-progress: false

jobs:
  identity:
    name: Validate release identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Require trusted manual workflow tooling
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Manual deployments must run from the main branch workflow."
          exit 1
      - name: Checkout deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
          path: release
          persist-credentials: false
      - name: Validate tag, versions, and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tooling/.github/scripts/validate-wordpress-org-release.sh release "$RELEASE_TAG"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C release rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validation:
    needs: identity
    uses: ./.github/workflows/release-validation.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.identity.outputs.sha }}
      tooling-ref: ${{ github.workflow_sha }}
    secrets:
      DEPENDENCY_READ_TOKEN: ${{ secrets.DEPENDENCY_READ_TOKEN }}
      ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
      WORDLIFT_API_URL: ${{ secrets.WORDLIFT_API_URL }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      VIMEO_API_KEY: ${{ secrets.VIMEO_API_KEY }}

  deploy:
    name: Deploy to WordPress.org
    needs:
      - identity
      - validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: wordpress.org
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false

      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 0
          path: release
          persist-credentials: false

      - name: Prepare filtered CRLF distribution
        run: tooling/.github/scripts/prepare-wordpress-org-dist.sh release "$GITHUB_WORKSPACE/staging"

      - name: Preflight changed files
        id: preflight
        env:
          ALLOW_LARGE_DIFF: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_diff || false }}
        run: >
          tooling/.github/scripts/preflight-wordpress-org-deploy.sh
          "$GITHUB_WORKSPACE/staging"
          "https://plugins.svn.wordpress.org/wordlift"
          "${{ needs.identity.outputs.version }}"
          100
          "$ALLOW_LARGE_DIFF"

      - name: Recheck immutable release tag
        env:
          EXPECTED_SHA: ${{ needs.identity.outputs.sha }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          git -C release fetch --force origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          actual_sha=$(git -C release rev-parse "refs/tags/$RELEASE_VERSION^{commit}")
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Release tag $RELEASE_VERSION moved after validation."
            exit 1
          fi

      - name: Publish changed files
        if: >-
          ${{ steps.preflight.outputs.already_exists != 'true' &&
              !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: >
          tooling/.github/scripts/publish-wordpress-org-release.sh
          "$GITHUB_WORKSPACE/staging"
          "https://plugins.svn.wordpress.org/wordlift"
          "$RELEASE_VERSION"
          false

      - name: Verify published release
        if: >-
          ${{ steps.preflight.outputs.already_exists != 'true' &&
              !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          EXPECTED_SHA: ${{ needs.identity.outputs.sha }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          git -C release fetch --force origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          actual_sha=$(git -C release rev-parse "refs/tags/$RELEASE_VERSION^{commit}")
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Release tag $RELEASE_VERSION moved during publication."
            exit 1
          fi
          tooling/.github/scripts/preflight-wordpress-org-deploy.sh \
            "$GITHUB_WORKSPACE/staging" \
            "https://plugins.svn.wordpress.org/wordlift" \
            "$RELEASE_VERSION" \
            100 \
            true
