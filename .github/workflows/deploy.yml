name: Deploy to WordPress.org

# MANUAL ONLY — this never runs by itself. Trigger it from the repo's "Actions" tab.
#   1st run: leave "Dry run" CHECKED (default) -> verifies the file list, deploys NOTHING.
#   2nd run: UNCHECK "Dry run"                 -> real deploy to wordpress.org/plugins/wordlift/
# Reuses the existing SVN_USERNAME / SVN_PASSWORD repo secrets (same as publish-readme.yml).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verify only — do NOT deploy)"
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to wordpress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version from src/wordlift.php
        id: version
        run: |
          version="$(grep -oP '^ \* Version:\s+\K[0-9]+\.[0-9]+\.[0-9]+' src/wordlift.php)"
          echo "Detected version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: WordPress.org deploy (10up)
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ inputs.dry_run }}
          generate-zip: true            # uploads the exact package as a downloadable artifact
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wordlift
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ./src              # the plugin itself (reads src/.distignore for exclusions)
          ASSETS_DIR: ./assets          # wp.org banners/icons (the 5 files at the repo root)
