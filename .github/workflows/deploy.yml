name: Deploy to WordPress.org

# Trigger it from the repo's "Actions" tab (manual) — available once this file is on the DEFAULT
# branch (main); GitHub hides the "Run workflow" button on feature branches.
#   1st run: leave "Dry run" CHECKED (default) -> verifies the file list, deploys NOTHING.
#   2nd run: UNCHECK "Dry run"                 -> real deploy to wordpress.org/plugins/wordlift/
# Reuses the existing SVN_USERNAME / SVN_PASSWORD repo secrets (same as publish-readme.yml).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (verify only — do NOT deploy)"
        type: boolean
        default: true
  # TEMP (remove before/at merge to main): lets us test on the plugin_check branch, where the
  # manual button isn't available yet. A push here always runs a FORCED dry-run — never a real
  # deploy (see the dry-run expression below).
  push:
    branches: [plugin_check]

jobs:
  deploy:
    name: Deploy to wordpress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version from src/wordlift.php
        id: version
        run: |
          version="$(grep -oP '^ \* Version:\s+\K[0-9]+\.[0-9]+\.[0-9]+' src/wordlift.php)"
          echo "Detected version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: WordPress.org deploy (10up)
        # Pinned to a full commit SHA (SonarCloud requirement) instead of the movable @stable tag.
        # 54bd289 = v2.3.0 — bump this SHA + comment together when upgrading.
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        with:
          # Manual runs honor the "Dry run" checkbox; any non-manual trigger (push) is FORCED to dry-run.
          dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wordlift
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ./src              # the plugin itself (reads src/.distignore for exclusions)
          ASSETS_DIR: ./assets          # wp.org banners/icons (the 5 files at the repo root)
