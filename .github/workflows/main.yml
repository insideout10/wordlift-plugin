name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validation:
    uses: ./.github/workflows/release-validation.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      tooling-ref: ${{ github.sha }}
    secrets:
      DEPENDENCY_READ_TOKEN: ${{ secrets.DEPENDENCY_READ_TOKEN }}
      ACF_PRO_KEY: ${{ secrets.ACF_PRO_KEY }}
      WORDLIFT_API_URL: ${{ secrets.WORDLIFT_API_URL }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      VIMEO_API_KEY: ${{ secrets.VIMEO_API_KEY }}

  cancel_running_workflows:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel running workflows
        uses: styfle/cancel-workflow-action@85880fa0301c86cca9da44039ee3bb12d3bedbfa # 0.12.1
        with:
          access_token: ${{ github.TOKEN }}

  raptive:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    needs: validation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Package and upload to blob storage
        run: ./.github/workflows/raptive.sh
        env:
          AZURE_STORAGE_SHARED_KEY_QUERY_PARAM: ${{ secrets.AZURE_STORAGE_SHARED_KEY_QUERY_PARAM }}
